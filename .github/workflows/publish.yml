name: publish
on:
  schedule: [{cron: "7,22,37,52 7-21 * * *"}, {cron: "2,17,32,47 8-21 * * *"}]   # every 15 min (GitHub drops some runs); the script enforces window, cap and gap
  workflow_dispatch: {inputs: {dry_run: {type: boolean, default: true}}}
concurrency: {group: ledger, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: {ref: main}   # tip of main at run time (not the trigger sha): a queued run must see the previous run's ledger commits
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install requests
      - uses: ./.github/actions/ffmpeg
      - run: python -u scripts/publish.py ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env: {IG_TOKEN: "${{ secrets.IG_TOKEN }}", MANUAL: "${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}"}
