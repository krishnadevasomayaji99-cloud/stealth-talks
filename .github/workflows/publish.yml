name: publish
on:
  schedule: [{cron: "7,22,37,52 7-21 * * *"}]   # every 15 min (GitHub drops some runs); the script enforces window, cap and gap
  workflow_dispatch: {inputs: {dry_run: {type: boolean, default: true}}}
concurrency: {group: ledger, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: ffmpeg (ffprobe is required by publish.py; bounded retries so a bad apt mirror cannot hang the job)
        run: |
          for i in 1 2 3; do
            which ffprobe && break
            sudo timeout 150 apt-get update -qq || true
            sudo timeout 240 apt-get install -y -qq --no-install-recommends ffmpeg && break || echo "apt attempt $i failed"
          done
          which ffprobe
      - run: python scripts/publish.py ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env: {IG_TOKEN: "${{ secrets.IG_TOKEN }}", MANUAL: "${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}"}
