name: refresh-token
on: {schedule: [{cron: "17 4 * * 1"}], workflow_dispatch: {}}   # weekly; token lasts ~60 days
concurrency: {group: ledger, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python scripts/token_refresh.py
        env: {IG_TOKEN: "${{ secrets.IG_TOKEN }}", REPO_ADMIN_PAT: "${{ secrets.REPO_ADMIN_PAT }}", FB_APP_ID: "${{ secrets.FB_APP_ID }}", FB_APP_SECRET: "${{ secrets.FB_APP_SECRET }}", GITHUB_REPOSITORY: "${{ github.repository }}"}
      - if: always()
        run: |
          git config user.name stealth-talks-bot; git config user.email bot@users.noreply.github.com
          git add data alerts; git commit -m "token status" || true; git pull --rebase; git push || true
