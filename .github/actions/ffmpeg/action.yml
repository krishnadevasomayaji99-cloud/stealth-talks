name: ffmpeg
description: Install ffmpeg/ffprobe without ever hanging (preinstalled -> apt with timeouts -> static build fallback)
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        if which ffmpeg && which ffprobe; then exit 0; fi
        for i in 1 2; do
          sudo timeout 90 apt-get update -qq || true
          sudo timeout 150 apt-get install -y -qq --no-install-recommends ffmpeg && break || echo "apt attempt $i failed"
        done
        if ! (which ffmpeg && which ffprobe); then
          echo "apt failed; using static build"
          d=$(mktemp -d); cd "$d"
          curl -fsSL --retry 3 --max-time 120 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o f.tar.xz
          tar xf f.tar.xz --strip-components=1
          sudo install -m755 ffmpeg ffprobe /usr/local/bin/
        fi
        which ffmpeg && which ffprobe
