<!doctype html><meta charset=utf-8><style>html,body{margin:0;background:#f4e9d8}canvas{display:block}</style>
<canvas id=c width=1080 height=1920></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
window.renderAt=t=>{x.fillStyle='#f4e9d8';x.fillRect(0,0,1080,1920);
 for(let i=0;i<40;i++){x.fillStyle=`hsl(${(i*9+t*40)%360} 60% 60%)`;x.beginPath();x.arc(540+Math.sin(t*2+i)*380,200+i*40+Math.cos(t*3+i)*30,50+10*Math.sin(t+i),0,7);x.fill()}
 x.fillStyle='#222';x.font='bold 90px sans-serif';x.fillText('t='+t.toFixed(2),60,1800)};
window.ready=true;
</script>
